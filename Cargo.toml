[package]
name = "y2m"
version = "0.1.1"
edition = "2021"
license = "MIT"

[dependencies]
axum = { version = "0.8", features = ["ws"] }
argon2 = "0.5"
rand = "0.9"
rand_core = { version = "0.6", features = ["getrandom"] }
rusqlite = { version = "0.32", features = ["bundled", "backup"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
futures-util = "0.3"
tokio = { version = "1", features = ["full"] }
tokio-rusqlite = "0.6"
